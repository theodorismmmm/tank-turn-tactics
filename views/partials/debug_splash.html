<div id="debug-splash" class="debug-splash" hidden aria-hidden="true">
    <div class="debug-splash__inner">
        <img class="debug-splash__logo" src="/assets/sentry-logo.svg" alt="Sentry" width="48" height="48" />
        <div class="debug-splash__track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100">
            <div class="debug-splash__bar"></div>
        </div>
    </div>
</div>

<style>
    .debug-splash[hidden] {
        display: none !important;
    }

    .debug-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0b0c;
        transition: opacity 0.4s ease;
    }

    .debug-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
    }

    .debug-splash__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 32px;
        width: min(220px, 56vw);
    }

    .debug-splash__logo {
        width: 48px;
        height: 48px;
        opacity: 0;
        animation: debugSplashLogoIn 0.55s ease forwards;
    }

    .debug-splash__track {
        width: 100%;
        height: 2px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        overflow: hidden;
    }

    .debug-splash__bar {
        width: 36%;
        height: 100%;
        border-radius: 999px;
        background: #ffffff;
        animation: debugSplashSlide 1.2s ease-in-out infinite;
    }

    @keyframes debugSplashLogoIn {
        from {
            opacity: 0;
            transform: translateY(4px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes debugSplashSlide {
        0% {
            transform: translateX(-130%);
        }
        100% {
            transform: translateX(340%);
        }
    }
</style>

<script>
    window.DebugSplash = (function () {
        function el() {
            return document.getElementById('debug-splash');
        }

        function show() {
            const node = el();
            if (!node) return;
            node.hidden = false;
            node.setAttribute('aria-hidden', 'false');
            node.classList.remove('is-hiding');
        }

        function hide(delayMs) {
            const node = el();
            if (!node) return Promise.resolve();
            const wait = typeof delayMs === 'number' ? delayMs : 0;
            return new Promise(function (resolve) {
                setTimeout(function () {
                    node.classList.add('is-hiding');
                    setTimeout(function () {
                        node.hidden = true;
                        node.setAttribute('aria-hidden', 'true');
                        node.classList.remove('is-hiding');
                        resolve();
                    }, 400);
                }, wait);
            });
        }

        function enter(form, minMs) {
            show();
            const wait = typeof minMs === 'number' ? minMs : 1000;
            setTimeout(function () {
                if (form) {
                    HTMLFormElement.prototype.submit.call(form);
                }
            }, wait);
        }

        return { show: show, hide: hide, enter: enter };
    })();
</script>
